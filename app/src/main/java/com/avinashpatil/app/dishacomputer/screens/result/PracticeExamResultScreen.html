<!DOCTYPE html>
<html class="dark" lang="mr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Quiz Results - Exam Complete</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700;800&amp;family=Noto+Sans+Marathi:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f425af",
                        "background-light": "#f8f5f7",
                        "background-dark": "#1a0b15",
                    },
                    fontFamily: {
                        "display": ["Spline Sans", "Noto Sans Marathi", "sans-serif"],
                        "marathi": ["Noto Sans Marathi", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        body {
            font-family: 'Noto Sans Marathi', 'Spline Sans', sans-serif;
        }
        .mesh-gradient {
            background-color: #1a0b15;
            background-image: 
                radial-gradient(at 0% 0%, hsla(320, 89%, 55%, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 0%, hsla(280, 80%, 40%, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, hsla(340, 90%, 50%, 0.12) 0px, transparent 50%),
                radial-gradient(at 0% 100%, hsla(260, 70%, 30%, 0.12) 0px, transparent 50%);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-pill {
            background: rgba(244, 37, 175, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(244, 37, 175, 0.2);
        }
    </style>
<style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-dark mesh-gradient min-h-screen flex items-center justify-center p-4">
<div class="relative w-full max-w-[400px] min-h-[812px] flex flex-col overflow-hidden bg-transparent">
<div class="flex items-center p-6 justify-between w-full">
<div class="text-white/80 p-2 rounded-full glass-card flex items-center justify-center cursor-pointer">
<span class="material-symbols-outlined text-xl">close</span>
</div>
<h2 class="text-white text-lg font-bold tracking-tight font-display">Exam Complete!</h2>
<div class="w-10"></div>
</div>
<div class="flex-1 px-6 py-4 flex flex-col justify-center">
<div class="glass-card rounded-xl p-8 flex flex-col items-center text-center shadow-2xl mb-6">
<div class="relative flex items-center justify-center mb-8">
<div class="w-44 h-44 rounded-full border-4 border-primary/20 flex items-center justify-center shadow-[0_0_40px_rgba(244,37,175,0.15)]">
<div class="absolute inset-0 rounded-full border-[3px] border-primary border-t-transparent animate-[spin_8s_linear_infinite]"></div>
<div class="flex flex-col items-center">
<h1 class="text-white text-[52px] font-black leading-none font-display">90<span class="text-primary text-2xl font-bold">/100</span></h1>
</div>
</div>
</div>
<h2 class="text-white text-2xl font-bold mb-4 font-marathi leading-snug">अभिनंदन!</h2>
<p class="text-white/70 text-base font-medium leading-relaxed font-marathi">
                    तुम्ही ही परीक्षा यशस्वीरीत्या पूर्ण केल्याबद्दल तुमचे अभिनंदन आणि तुम्हाला पुढील परीक्षांसाठी खूप खूप शुभेच्छा.
                </p>
<div class="flex flex-col items-center gap-3 w-full mt-6 pt-6 border-t border-white/10">
<div class="flex gap-1">
<span class="material-symbols-outlined text-primary fill-1" style="font-variation-settings: 'FILL' 1">star</span>
<span class="material-symbols-outlined text-primary fill-1" style="font-variation-settings: 'FILL' 1">star</span>
<span class="material-symbols-outlined text-primary fill-1" style="font-variation-settings: 'FILL' 1">star</span>
<span class="material-symbols-outlined text-primary fill-1" style="font-variation-settings: 'FILL' 1">star</span>
<span class="material-symbols-outlined text-primary/30">star</span>
</div>
</div>
</div>
<div class="grid grid-cols-3 gap-3">
<div class="glass-pill rounded-lg p-3 flex flex-col items-center text-center">
<span class="material-symbols-outlined text-[#0bda87] mb-1.5 text-lg">check_circle</span>
<p class="text-white/50 text-[9px] uppercase font-bold tracking-widest mb-1">Correct</p>
<p class="text-white text-lg font-bold">18</p>
</div>
<div class="glass-pill rounded-lg p-3 flex flex-col items-center text-center">
<span class="material-symbols-outlined text-[#fa7938] mb-1.5 text-lg">cancel</span>
<p class="text-white/50 text-[9px] uppercase font-bold tracking-widest mb-1">Wrong</p>
<p class="text-white text-lg font-bold">02</p>
</div>
<div class="glass-pill rounded-lg p-3 flex flex-col items-center text-center">
<span class="material-symbols-outlined text-primary mb-1.5 text-lg">target</span>
<p class="text-white/50 text-[9px] uppercase font-bold tracking-widest mb-1">Accuracy</p>
<p class="text-white text-lg font-bold">90%</p>
</div>
</div>
</div>
<div class="p-8 flex flex-col gap-6 items-center">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-5 rounded-full shadow-[0_8px_32px_rgba(244,37,175,0.35)] active:scale-95 transition-all flex items-center justify-center gap-3">
<span class="material-symbols-outlined">replay</span>
<span class="font-marathi tracking-wide">Retry</span>
</button>
</div>
</div>

</body></html>
