<!DOCTYPE html>
<html class="light" lang="en"><head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Vibrant Gradient Topic Selection</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f8fafc",
                        "background-dark": "#0f172a",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "2xl": "2rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
    <style type="text/tailwindcss">
        body {
            font-family: 'Lexend', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .card-shadow {
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.04);
        }
        .gradient-text {
            background: linear-gradient(135deg, #137fec 0%, #06b6d4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .card-overlay {
            background: linear-gradient(145deg, rgba(255,255,255,0.05) 0%, rgba(0,0,0,0.01) 100%);
        }
        .dark .card-overlay {
            background: linear-gradient(145deg, rgba(255,255,255,0.02) 0%, rgba(0,0,0,0.05) 100%);
        }
    </style>
    <style>
        body {
          min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark min-h-screen">
<div class="max-w-[430px] mx-auto bg-background-light dark:bg-background-dark min-h-screen relative shadow-2xl overflow-x-hidden">
    <div class="h-14 w-full"></div>
    <header class="flex items-center px-6 py-4 sticky top-0 bg-background-light/90 dark:bg-background-dark/90 backdrop-blur-xl z-20">
        <div class="flex items-center justify-center size-10 rounded-full bg-white dark:bg-slate-800 shadow-sm border border-gray-100 dark:border-slate-700 hover:bg-gray-50 dark:hover:bg-slate-700 transition-colors">
            <span class="material-symbols-outlined text-[#111418] dark:text-white text-xl ml-1">arrow_back_ios</span>
        </div>
        <div class="flex-1 text-center pr-10">
            <h1 class="gradient-text text-xl font-bold tracking-tight">Topic Wise Quiz</h1>
        </div>
    </header>
    <div class="px-6 py-2">
        <label class="flex flex-col w-full">
            <div class="flex w-full items-stretch rounded-2xl h-14 bg-white dark:bg-slate-800 border border-gray-100 dark:border-slate-700 focus-within:ring-2 focus-within:ring-primary/20 transition-all shadow-sm">
                <div class="flex items-center justify-center pl-4">
                    <span class="material-symbols-outlined text-gray-400">search</span>
                </div>
                <input class="w-full bg-transparent border-none focus:ring-0 text-[#111418] dark:text-white placeholder:text-gray-400 text-base font-normal px-3" placeholder="Search your favorite topic..."/>
            </div>
        </label>
    </div>
    <main class="pb-12 pt-4">
        <div class="px-6 py-2.5">
            <div class="relative overflow-hidden group bg-white dark:bg-slate-800 rounded-2xl p-4 flex items-center gap-4 card-shadow border border-gray-100 dark:border-slate-700 active:scale-[0.97] transition-all">
                <div class="card-overlay absolute inset-0 pointer-events-none"></div>
                <div class="size-16 rounded-full bg-gradient-to-br from-orange-400 to-yellow-300 flex items-center justify-center text-white shrink-0 shadow-lg shadow-orange-200 dark:shadow-none">
                    <span class="material-symbols-outlined text-3xl">functions</span>
                </div>
                <div class="flex-1">
                    <h4 class="text-[#111418] dark:text-slate-100 font-bold text-lg leading-tight">Algebra Basics</h4>
                </div>
                <div class="size-8 rounded-full flex items-center justify-center bg-gray-50 dark:bg-slate-700">
                    <span class="material-symbols-outlined text-gray-400 text-xl">chevron_right</span>
                </div>
            </div>
        </div>
        <div class="px-6 py-2.5">
            <div class="relative overflow-hidden bg-white dark:bg-slate-800 rounded-2xl p-4 flex items-center gap-4 card-shadow border border-gray-100 dark:border-slate-700 active:scale-[0.97] transition-all">
                <div class="card-overlay absolute inset-0 pointer-events-none"></div>
                <div class="size-16 rounded-full bg-gradient-to-br from-blue-500 to-cyan-300 flex items-center justify-center text-white shrink-0 shadow-lg shadow-blue-200 dark:shadow-none">
                    <span class="material-symbols-outlined text-3xl">category</span>
                </div>
                <div class="flex-1">
                    <h4 class="text-[#111418] dark:text-slate-100 font-bold text-lg leading-tight">Geometry &amp; Shapes</h4>
                </div>
                <div class="size-8 rounded-full flex items-center justify-center bg-gray-50 dark:bg-slate-700">
                    <span class="material-symbols-outlined text-gray-400 text-xl">chevron_right</span>
                </div>
            </div>
        </div>
        <div class="px-6 py-2.5">
            <div class="relative overflow-hidden bg-white dark:bg-slate-800 rounded-2xl p-4 flex items-center gap-4 card-shadow border border-gray-100 dark:border-slate-700 active:scale-[0.97] transition-all">
                <div class="card-overlay absolute inset-0 pointer-events-none"></div>
                <div class="size-16 rounded-full bg-gradient-to-br from-emerald-500 to-lime-300 flex items-center justify-center text-white shrink-0 shadow-lg shadow-emerald-200 dark:shadow-none">
                    <span class="material-symbols-outlined text-3xl">biotech</span>
                </div>
                <div class="flex-1">
                    <h4 class="text-[#111418] dark:text-slate-100 font-bold text-lg leading-tight">Cell Biology</h4>
                </div>
                <div class="size-8 rounded-full flex items-center justify-center bg-gray-50 dark:bg-slate-700">
                    <span class="material-symbols-outlined text-gray-400 text-xl">chevron_right</span>
                </div>
            </div>
        </div>
        <div class="px-6 py-2.5">
            <div class="relative overflow-hidden bg-white dark:bg-slate-800 rounded-2xl p-4 flex items-center gap-4 card-shadow border border-gray-100 dark:border-slate-700 active:scale-[0.97] transition-all">
                <div class="card-overlay absolute inset-0 pointer-events-none"></div>
                <div class="size-16 rounded-full bg-gradient-to-br from-purple-500 to-pink-400 flex items-center justify-center text-white shrink-0 shadow-lg shadow-purple-200 dark:shadow-none">
                    <span class="material-symbols-outlined text-3xl">bolt</span>
                </div>
                <div class="flex-1">
                    <h4 class="text-[#111418] dark:text-slate-100 font-bold text-lg leading-tight">Thermodynamics</h4>
                </div>
                <div class="size-8 rounded-full flex items-center justify-center bg-gray-50 dark:bg-slate-700">
                    <span class="material-symbols-outlined text-gray-400 text-xl">chevron_right</span>
                </div>
            </div>
        </div>
        <div class="px-6 py-2.5">
            <div class="relative overflow-hidden bg-white dark:bg-slate-800 rounded-2xl p-4 flex items-center gap-4 card-shadow border border-gray-100 dark:border-slate-700 active:scale-[0.97] transition-all">
                <div class="card-overlay absolute inset-0 pointer-events-none"></div>
                <div class="size-16 rounded-full bg-gradient-to-br from-rose-500 to-orange-300 flex items-center justify-center text-white shrink-0 shadow-lg shadow-rose-200 dark:shadow-none">
                    <span class="material-symbols-outlined text-3xl">auto_stories</span>
                </div>
                <div class="flex-1">
                    <h4 class="text-[#111418] dark:text-slate-100 font-bold text-lg leading-tight">Classic Poetry</h4>
                </div>
                <div class="size-8 rounded-full flex items-center justify-center bg-gray-50 dark:bg-slate-700">
                    <span class="material-symbols-outlined text-gray-400 text-xl">chevron_right</span>
                </div>
            </div>
        </div>
        <div class="px-6 py-2.5">
            <div class="relative overflow-hidden bg-white dark:bg-slate-800 rounded-2xl p-4 flex items-center gap-4 card-shadow border border-gray-100 dark:border-slate-700 active:scale-[0.97] transition-all">
                <div class="card-overlay absolute inset-0 pointer-events-none"></div>
                <div class="size-16 rounded-full bg-gradient-to-br from-indigo-500 to-blue-400 flex items-center justify-center text-white shrink-0 shadow-lg shadow-indigo-200 dark:shadow-none">
                    <span class="material-symbols-outlined text-3xl">history_edu</span>
                </div>
                <div class="flex-1">
                    <h4 class="text-[#111418] dark:text-slate-100 font-bold text-lg leading-tight">Ancient Civilizations</h4>
                </div>
                <div class="size-8 rounded-full flex items-center justify-center bg-gray-50 dark:bg-slate-700">
                    <span class="material-symbols-outlined text-gray-400 text-xl">chevron_right</span>
                </div>
            </div>
        </div>
    </main>
</div>

</body></html>
