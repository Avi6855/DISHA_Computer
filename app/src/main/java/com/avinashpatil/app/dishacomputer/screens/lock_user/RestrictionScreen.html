<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Account Lockout Variant 2</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#135bec",
                        "background-light": "#f6f6f8",
                        "background-dark": "#101622",
                        "alert-orange": "#FF4500",
                        "alert-red": "#FF0000",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        body {
            font-family: 'Lexend', sans-serif;
            -webkit-tap-highlight-color: transparent;
            min-height: max(884px, 100dvh);
        }
        .frosted-glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .neon-glow {
            box-shadow: 0 0 20px rgba(255, 69, 0, 0.3);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col font-display transition-colors duration-300">
<header class="flex items-center bg-transparent p-4 pb-2 z-10 min-h-[64px]">
<h2 class="text-white text-lg font-bold leading-tight tracking-[-0.015em] w-full text-center">DISHA Computer Education</h2>
</header>
<main class="flex-1 flex flex-col items-center justify-center px-6 relative">
<div class="relative mb-12 flex items-center justify-center">
<div class="absolute inset-0 bg-gradient-to-tr from-alert-orange to-alert-red blur-[40px] opacity-20 rounded-full"></div>
<div class="relative w-40 h-40 flex items-center justify-center">
<div class="absolute inset-0 rounded-2xl border-4 border-alert-orange/30 rotate-45 scale-90"></div>
<div class="absolute inset-0 rounded-2xl border-4 border-alert-red/30 -rotate-12"></div>
<div class="w-24 h-24 bg-gradient-to-br from-alert-orange to-alert-red rounded-3xl flex items-center justify-center shadow-2xl neon-glow">
<span class="material-symbols-outlined text-white text-6xl font-light">lock_person</span>
</div>
</div>
</div>
<div class="w-full max-w-sm frosted-glass rounded-3xl p-8 shadow-2xl relative overflow-hidden">
<div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-alert-orange/50 via-alert-red/50 to-alert-orange/50"></div>
<div class="text-center">
<h1 class="text-white tracking-tight text-3xl font-bold leading-tight mb-4">
                    Account Locked
                </h1>
<p class="text-gray-400 text-base font-normal leading-relaxed">
                    You were locked from <span class="text-white font-medium">DISHA Computer Education</span>. For security reasons, please contact your local branch to regain access.
                </p>
</div>
</div>
<div class="absolute top-1/4 -left-20 w-64 h-64 bg-primary/10 rounded-full blur-[100px] -z-10"></div>
<div class="absolute bottom-1/4 -right-20 w-64 h-64 bg-alert-red/10 rounded-full blur-[100px] -z-10"></div>
</main>
<footer class="p-6 flex justify-end items-end pb-12">
<button class="flex items-center justify-center rounded-xl h-14 px-6 bg-primary text-white text-base font-bold leading-normal tracking-wide shadow-lg hover:scale-105 transition-transform active:scale-95 gap-3">
<span class="material-symbols-outlined text-2xl">support_agent</span>
<span>Contact Support</span>
</button>
</footer>
<div class="h-5 bg-transparent"></div>

</body></html>
